<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado da infraestrutura</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
</head>

<body>
    <nav>
        <ul>
            <li><a href="/" class="active">Página inicial</a></li>
            <li><a href="/hosts">Hosts</a></li>
            <li>
                <a href="http://localhost/zabbix" target="_blank" style="display: flex; align-items: center; gap: 6px;">Zabbix
                    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                        width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <div id="problems-overview" class="problems-overview" style="display: none;">
            <div class="problem-stat">
                <span id="total-problems-count" class="stat-big">0</span>
                <span class="stat-label">Problemas</span>
            </div>
            <div class="problem-stat">
                <span id="unack-problems-count" class="stat-big highlight-red">0</span>
                <span class="stat-label" style="text-align: center;">Problemas<br>Não Reconhecidos</span>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn-check" onclick="updateText()">Verificar infraestrutura</button>
        </div>

        <section id="infrastructure-summary" class="summary-card" style="display: none;">
        </section>
    </main>
    <script src="/static/script.js"></script>
</body>

</html>
