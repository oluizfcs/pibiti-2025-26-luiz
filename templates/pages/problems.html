{% extends 'base.html' %}

{% block content %}
<section class="card">
    <h1>Problemas</h1>
    <p>Os problemas são todos os incidentes e falhas ativos capturados pelo sistema de monitoramento Zabbix.</p>
</section>

<main class="card" id="main-content">
    <div id="problems">
        Carregando lista de problemas...

    <div id="explanation-box" aria-live="polite"></div>
